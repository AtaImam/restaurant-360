<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Checkout</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Arial, sans-serif;
        background: #f7f7f7;
        color: #222;
      }

      .container {
        max-width: 700px;
        margin: 40px auto;
        padding: 0 16px;
      }

      .header {
        margin-bottom: 25px;
      }

      .header h1 {
        margin-bottom: 6px;
      }

      .restaurant-info {
        color: #666;
      }

      .box {
        background: white;
        padding: 20px;
        border-radius: 12px;
        margin-bottom: 18px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
      }

      .box h2 {
        font-size: 18px;
        margin-bottom: 16px;
      }

      .order-item {
        display: flex;
        justify-content: space-between;
        gap: 15px;
        padding: 12px 0;
        border-bottom: 1px solid #eee;
      }

      .order-item:last-child {
        border-bottom: none;
      }

      .item-name {
        font-weight: bold;
      }

      .quantity {
        color: #666;
        font-size: 14px;
        margin-top: 4px;
      }

      .total {
        display: flex;
        justify-content: space-between;
        font-size: 21px;
        font-weight: bold;
      }

      .order-type {
        display: block;
        padding: 15px;
        border: 1px solid #ddd;
        border-radius: 10px;
        margin-bottom: 12px;
        cursor: pointer;
      }

      .order-type input {
        margin-right: 8px;
      }

      .place-order {
        width: 100%;
        border: none;
        background: #111;
        color: white;
        padding: 15px;
        border-radius: 10px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
      }

      .place-order:hover {
        opacity: 0.85;
      }

      .back {
        display: block;
        text-align: center;
        margin-top: 16px;
        color: #555;
        text-decoration: none;
      }

      @media (max-width: 600px) {
        .container {
          margin-top: 25px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="header">
        <h1>Checkout</h1>

        <p class="restaurant-info">
          {{ restaurant.name }} · Table {{ table.table_number }}
        </p>
      </div>

      <div class="box">
        <h2>Your Order</h2>

        {% for item_id, item in cart.items %}

        <div class="order-item">
          <div>
            <p class="item-name">{{ item.name }}</p>

            <p class="quantity">Quantity: {{ item.quantity }}</p>
          </div>

          <strong> ৳{{ item.subtotal }} </strong>
        </div>

        {% endfor %}
      </div>

      <div class="box">
        <div class="total">
          <span>Total</span>
          <span>৳{{ total }}</span>
        </div>
      </div>

      <form method="POST">
        {% csrf_token %}

        <div class="box">
          <h2>Order Type</h2>

          <label class="order-type">
            <input type="radio" name="order_type" value="DINE_IN" checked />

            Dine In
          </label>

          <label class="order-type">
            <input type="radio" name="order_type" value="TAKEAWAY" />

            Takeaway
          </label>
        </div>

        <button type="submit" class="place-order">
          Place Order · ৳{{ total }}
        </button>
      </form>

      <a href="{% url 'cart' restaurant.id table.id %}" class="back">
        ← Back to Cart
      </a>
    </div>
  </body>
</html>
